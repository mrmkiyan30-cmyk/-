<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کتاب من</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{

background:linear-gradient(135deg,#9ad7ff,#edf9ff);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}

.card{

width:360px;

background:white;

border-radius:25px;

padding:30px;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.2);

}

h1{

color:#1f4b99;

margin-bottom:15px;

}

p{

margin-bottom:25px;

line-height:2;

}

a{

display:block;

background:#2f80ed;

color:white;

padding:16px;

border-radius:15px;

text-decoration:none;

font-size:20px;

transition:.3s;

}

a:hover{

background:#1565c0;

}

.footer{

margin-top:25px;

font-size:14px;

color:#888;

}

</style>

</head>

<body>

<div class="card">

<h1>📖 کتاب من</h1>

<p>

به نسخه دیجیتال کتاب خوش آمدید

</p>

</a>

<div class="footer">

نسخه 1.0

</div>

</div>

</body>

</html>
